<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBD Hardware B2B AI Customer Development System</title>
<style>
  :root{
    --bg:#eef1f6; --side:#0f1b2d; --side2:#16263c; --card:#ffffff;
    --ink:#1f2937; --muted:#6b7280; --line:#e3e8ef;
    --primary:#f5a623; --primary-d:#d98e0d; --accent:#2563eb;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --soft:#f3f6fb;
    --tbd:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;display:flex;overflow:hidden;}
  /* ---------- 侧边栏 ---------- */
  .sidebar{width:236px;background:linear-gradient(180deg,var(--side),var(--side2));
    color:#cdd6e4;display:flex;flex-direction:column;flex-shrink:0;}
  .brand{padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand .logo{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:8px;background:var(--primary);
    color:#1a1a1a;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .brand h1{font-size:13px;color:#fff;font-weight:700;line-height:1.35;}
  .brand .sub{font-size:10.5px;color:#7c8aa0;margin-top:3px;letter-spacing:.4px;}
  .nav{padding:10px 10px;flex:1;overflow:auto;}
  .nav .group{font-size:10.5px;color:#5e6c80;padding:10px 12px 6px;letter-spacing:1px;}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
    color:#b9c4d4;cursor:pointer;margin-bottom:2px;text-decoration:none;font-size:13px;transition:.15s;}
  .nav a .ico{width:18px;text-align:center;font-size:14px;opacity:.9;flex-shrink:0;}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav a.active{background:var(--primary);color:#1a1a1a;font-weight:600;}
  .nav a .tag{margin-left:auto;font-size:10px;background:rgba(255,255,255,.15);
    padding:1px 6px;border-radius:6px;color:#fff;}
  .nav a.active .tag{background:rgba(0,0,0,.15);color:#1a1a1a;}
  .nav .count{margin-left:auto;font-size:11px;color:#7c8aa0;}
  .nav a.active .count{color:#1a1a1a;}
  .side-foot{padding:12px 18px;font-size:10.5px;color:#5e6c80;border-top:1px solid rgba(255,255,255,.08);line-height:1.6;}
  /* ---------- 主区 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:58px;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;}
  .topbar h2{font-size:17px;font-weight:700;}
  .topbar .crumb{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .topbar .spacer{flex:1;}
  .search{flex:1;max-width:340px;position:relative;}
  .search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);
    border-radius:8px;font-size:13px;background:var(--soft);}
  .search input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);}
  .btn{padding:8px 14px;border:none;border-radius:8px;font-size:13px;cursor:pointer;
    font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn-primary{background:var(--primary);color:#1a1a1a;}
  .btn-primary:hover{background:var(--primary-d);}
  .btn-ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{background:#e9eef6;}
  .btn-danger{background:#fee2e2;color:var(--bad);}
  .btn-danger:hover{background:#fecaca;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .content{padding:20px;overflow:auto;flex:1;}
  /* ---------- 统计 / 面板 ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s;}
  .stat:hover{border-color:var(--primary);transform:translateY(-1px);}
  .stat .k{font-size:11.5px;color:var(--muted);}
  .stat .v{font-size:24px;font-weight:800;margin-top:5px;color:#0f1b2d;}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:600;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .panel h3{font-size:14.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .panel h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);}
  .panel h3 .r{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400;}
  /* 今日待办 */
  .todos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
  .todo{border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:var(--soft);transition:.15s;}
  .todo:hover{border-color:var(--primary);background:#fff;}
  .todo .n{font-size:24px;font-weight:800;color:#0f1b2d;}
  .todo .t{font-size:12.5px;color:var(--ink);font-weight:600;margin-top:4px;}
  .todo .d{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .todo.hot{border-color:var(--primary);background:#fff8ec;}
  /* 漏斗 */
  .funnel{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;}
  .fstep{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:96px;text-align:center;}
  .fstep .n{font-size:18px;font-weight:800;color:#0f1b2d;}
  .fstep .t{font-size:11px;color:var(--muted);margin-top:2px;}
  .fstep.on{background:#fff8ec;border-color:var(--primary);}
  .farr{display:flex;align-items:center;color:var(--muted);font-size:12px;}
  /* ---------- 表格 ---------- */
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
  th{background:var(--soft);color:var(--muted);font-weight:600;font-size:11.5px;}
  tbody tr:hover{background:#fafbfd;}
  td .thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:#f0f2f5;}
  .id-link{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none;}
  .id-link:hover{text-decoration:underline;}
  .row-title{cursor:pointer;color:var(--ink);}
  .row-title:hover{color:var(--accent);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .b-a,.b-高,.b-强,.b-是,.b-完整{background:#dcfce7;color:var(--ok);}
  .b-b,.b-中,.b-部分{background:#fef3c7;color:var(--warn);}
  .b-c,.b-低,.b-弱,.b-否,.b-缺失,.b-暂停{background:#fee2e2;color:var(--bad);}
  .b-info{background:#dbeafe;color:#1d4ed8;}
  .b-none{background:#f1f5f9;color:var(--muted);}
  .tbd{color:var(--tbd);font-style:italic;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .empty{padding:44px 20px;text-align:center;color:var(--muted);}
  .empty .big{font-size:40px;margin-bottom:10px;}
  .cmp-list{display:flex;gap:6px;flex-wrap:wrap;}
  /* ---------- 工具栏 ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .toolbar select,.toolbar input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
  .toolbar .cnt{margin-left:auto;font-size:12.5px;color:var(--muted);}
  /* ---------- 模态框 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,27,45,.55);display:none;
    align-items:flex-start;justify-content:center;padding:36px 14px;z-index:50;overflow:auto;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:660px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal.wide{max-width:820px;}
  .modal.xwide{max-width:1000px;}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .modal-head h3{font-size:16px;}
  .modal-head .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .modal-head .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;}
  .modal-body{padding:18px 20px;max-height:68vh;overflow:auto;}
  .modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .modal-foot .left{margin-right:auto;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;color:var(--muted);font-weight:600;}
  .field label .req{color:var(--bad);}
  .field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);width:100%;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field input[readonly]{background:var(--soft);color:var(--muted);}
  .field textarea{resize:vertical;min-height:62px;}
  .field .hint{font-size:11px;color:var(--muted);}
  .filebox{border:1.5px dashed var(--line);border-radius:8px;padding:10px;text-align:center;cursor:pointer;background:var(--soft);}
  .filebox:hover{border-color:var(--accent);}
  .filebox .pv{margin-top:8px;}
  .filebox img{max-width:110px;max-height:110px;border-radius:6px;border:1px solid var(--line);}
  .filebox .lnk{color:var(--accent);font-weight:600;}
  /* 详情 */
  .sec-title{font-size:12.5px;font-weight:700;color:var(--ink);margin:16px 0 8px;padding-left:8px;border-left:3px solid var(--primary);}
  .sec-title:first-child{margin-top:0;}
  .kvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px;}
  .kv{font-size:13px;}
  .kv .k{font-size:11.5px;color:var(--muted);font-weight:600;}
  .kv .v{margin-top:2px;word-break:break-word;white-space:pre-wrap;line-height:1.6;}
  .hero{display:flex;gap:14px;align-items:flex-start;}
  .hero img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--soft);}
  .hero .noimg{width:120px;height:120px;border-radius:10px;border:1px dashed var(--line);display:flex;
    align-items:center;justify-content:center;color:var(--muted);font-size:11px;background:var(--soft);}
  /* 时间线 */
  .tl{position:relative;padding-left:18px;}
  .tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line);}
  .tli{position:relative;padding:0 0 14px 6px;}
  .tli::before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;
    background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .tli.blue::before{background:var(--accent);}
  .tli.green::before{background:var(--ok);}
  .tli.red::before{background:var(--bad);}
  .tli .h{font-size:13px;font-weight:600;}
  .tli .m{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .tli .b{font-size:12.5px;color:var(--ink);margin-top:4px;white-space:pre-wrap;line-height:1.6;}
  .relgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .relcard{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:var(--soft);}
  .relcard:hover{border-color:var(--primary);background:#fff;}
  .relcard img{width:100%;height:80px;object-fit:cover;border-radius:6px;background:#fff;border:1px solid var(--line);}
  .relcard .noimg{height:80px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;
    justify-content:center;color:var(--muted);font-size:11px;}
  .relcard .n{font-size:12px;margin-top:6px;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .relcard .i{font-size:11px;color:var(--accent);font-weight:600;}
  .ainfo{background:#fff8ec;border:1px solid #fcd9a3;border-radius:10px;padding:12px;font-size:12.5px;line-height:1.7;}
  .ainfo .h{font-weight:700;color:#92400e;}
  .chipbar{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{background:var(--primary);color:#1a1a1a;font-size:11.5px;font-weight:600;
    padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
  .chip.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line);}
  .chip button{background:none;border:none;cursor:pointer;font-size:13px;font-weight:800;color:inherit;}
  .muted{color:var(--muted);}
  .ph{text-align:center;padding:56px 20px;color:var(--muted);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#0f1b2d;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;
    opacity:0;transition:.25s;z-index:99;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c5cdd9;border-radius:6px;}
  /* ---------- 移动端 ---------- */
  @media (max-width:900px){
    body{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;gap:10px;padding:8px 10px;overflow-x:auto;}
    .brand{border:none;padding:0;}
    .brand h1{display:none;} .brand .sub{display:none;}
    .nav{display:flex;gap:6px;padding:0;overflow-x:auto;}
    .nav .group{display:none;}
    .nav a{margin-bottom:0;padding:7px 10px;flex-shrink:0;}
    .nav a .ico{display:none;}
    .nav a .tag,.nav a .count{display:none;}
    .side-foot{display:none;}
    .main{min-height:0;}
    .topbar{height:auto;flex-wrap:wrap;padding:10px 12px;gap:8px;}
    .search{max-width:100%;order:3;}
    .content{padding:12px;}
    .grid2{grid-template-columns:1fr;}
    .stats{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));}
    .modal{max-width:100%;}
    .overlay{padding:10px;}
  }
</style>
</head>
<body>
  <!-- 侧边栏（导航由 JS 根据 NAV 配置生成，保持唯一真相源） -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="mark">TBD</div>
        <div>
          <h1>TBD Hardware B2B</h1>
          <div class="sub">AI Customer Development System</div>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="syncFoot">⏳ 正在连接云端…<br>供应链 → 产品 → AI背调 → CRM → 成交</div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">数据看板</h2>
        <div class="crumb" id="pageCrumb">全局业务状态</div>
      </div>
      <div class="spacer"></div>
      <div class="search">
        <span class="si">🔍</span>
        <input id="globalSearch" placeholder="搜索（公司 / 工厂 / 产品…）">
      </div>
      <button class="btn btn-primary" id="addBtn">＋ 新增</button>
    </div>
    <div class="content" id="content"></div>
  </main>

  <!-- 模态框 -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>
<script>
/* ============================================================
   TBD Hardware B2B AI Customer Development System
   核心层：存储 / 编号 / 通用 CRUD 引擎 / 组件
   ------------------------------------------------------------
   主线数据结构：
   Supplier ID → Product ID → Product Knowledge → Company ID
   → Product Matching → Decision Maker → CRM → Follow-up → Order
   ============================================================ */

/* ---------- 集合与本地键 ---------- */
const KEY = {
  factory :"tbd_factories_v1",
  product :"tbd_products_v1",
  featured:"tbd_featured_v1",
  kb      :"tbd_kb_v1",
  lead    :"tbd_leads_v1",
  contact :"tbd_contacts_v1",
  crm     :"tbd_crm_v1",
  task    :"tbd_tasks_v1",
  email   :"tbd_emails_v1",
  act     :"tbd_acts_v1",
  settings:"tbd_settings_v1"
};
const COLS = Object.keys(KEY);

function rd(k, def){
  try{ const v=JSON.parse(localStorage.getItem(KEY[k])); return Array.isArray(v)?v:(typeof v==="object"&&v)||def; }
  catch(e){ return def; }
}
function wr(k, v){ localStorage.setItem(KEY[k], JSON.stringify(v)); syncSoon(); }

/* ---------- 编号自动生成 ---------- */
function genId(prefix, coll, field, pad){
  let m=0; const re=new RegExp("^"+prefix+"(\\d+)$");
  rd(coll,[]).forEach(o=>{ const x=re.exec(o[field]||""); if(x) m=Math.max(m,+x[1]); });
  return prefix+String(m+1).padStart(pad,"0");
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ---------- 工具 ---------- */
function $(s,r){ return (r||document).querySelector(s); }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2000); }
function badge(v){
  if(v==null||v==="") return '<span class="badge b-none">—</span>';
  return '<span class="badge b-'+esc(v)+'">'+esc(v)+"</span>";
}
function tbdOr(v){ return (v==null||v==="")?'<span class="tbd">TBD / 待确认</span>':esc(v); }

/* ---------- 图片 / 文件上传 ---------- */
function readAsset(file, cb){
  if(!file) return cb(null);
  if(file.type==="application/pdf"){
    const r=new FileReader();
    r.onload=e=>cb({type:"file",name:file.name,data:e.target.result});
    r.readAsDataURL(file); return;
  }
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height; const M=900;
      if(w>h&&w>M){h=Math.round(h*M/w);w=M;} else if(h>M){w=Math.round(w*M/h);h=M;}
      const c=document.createElement("canvas"); c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb({type:"img",name:file.name,data:c.toDataURL("image/jpeg",0.72)});
    };
    img.onerror=()=>cb(null);
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}
function assetView(a, cls){
  if(!a||!a.data) return '<div class="noimg">未上传</div>';
  if(a.type==="img") return '<img src="'+a.data+'" alt="">';
  return '<div class="lnk">📄 '+esc(a.name||"图纸")+"</div>";
}

/* ---------- 模态框 ---------- */
function openModal(html, cls){
  const m=$("#modal"); m.className="modal "+(cls||""); m.innerHTML=html;
  $("#overlay").classList.add("show");
}
function closeModal(){ $("#overlay").classList.remove("show"); $("#modal").innerHTML=""; }
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });

function confirmBox(msg, onYes){
  openModal(
    '<div class="modal-head"><h3>请确认</h3><span class="x" data-act="close">×</span></div>'+
    '<div class="modal-body"><div style="font-size:13.5px;line-height:1.7">'+msg+"</div></div>"+
    '<div class="modal-foot"><button class="btn btn-ghost" data-act="close">取消</button>'+
    '<button class="btn btn-danger" id="cfmYes">确定</button></div>', "");
  const yes=$("#cfmYes");
  yes.onclick=()=>{ closeModal(); onYes(); };
}

/* ============================================================
   云端同步（服务器为唯一真相源，本机 localStorage 仅作离线缓存）
   ============================================================ */
function collect_all(){
  const o={};
  COLS.forEach(c=>{ o[c]= (c==="settings")? rd(c,{}): rd(c,[]); });
  /* 兼容旧版服务端校验（旧 server.js 只认 factories / products） */
  o.factories=o.factory; o.products=o.product;
  return o;
}
function apply_all(d){
  if(!d) return;
  COLS.forEach(c=>{ const v=d[c]; if(v!==undefined) localStorage.setItem(KEY[c], JSON.stringify(v)); });
}
async function pushSnapshot(){
  try{
    const r=await fetch("/api/snapshot",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(collect_all())});
    setSync(r.ok?"cloud":"error");
  }catch(e){ setSync("offline"); }
}
async function pullSnapshot(){
  try{
    const r=await fetch("/api/snapshot"); const d=await r.json();
    /* 服务器为空 → 不允许覆盖本机数据，反手把本机数据种上去 */
    const total=d?COLS.filter(c=>c!=="settings"&&Array.isArray(d[c]))
                      .reduce((n,c)=>n+d[c].length,0):0;
    if(d && total>0){ apply_all(d); setSync("cloud"); }
    else await pushSnapshot();
  }catch(e){ setSync("offline"); }
}
let _pt=null;
function syncSoon(){ clearTimeout(_pt); _pt=setTimeout(pushSnapshot,450); }
function setSync(mode){
  const f=$("#syncFoot"); if(!f) return;
  const tag="Phase 1 · 已跑通全链路数据结构";
  if(mode==="cloud")        f.innerHTML="☁ 云端已同步<br>"+tag;
  else if(mode==="syncing") f.innerHTML="⏳ 正在连接云端…<br>"+tag;
  else if(mode==="offline") f.innerHTML="⚠ 离线（本地已存）<br>"+tag;
  else                      f.innerHTML="⚠ 同步异常<br>"+tag;
}

/* ============================================================
   通用 CRUD 引擎（由 SCHEMA 驱动，所有模块行为保持一致）
   ============================================================ */
let FORM=null, FORMCOLL=null, FORMID=null, AFTER=null;

function sch(coll){ return SCHEMA[coll]; }
function rowTitle(coll,o){ const s=sch(coll); return (s.title?s.title(o):(o[s.nameKey||"name"]))||"—"; }
function toBDash(){} // placeholder

function cellValue(coll,o,k){
  const s=sch(coll), f=s.fields.find(x=>x.k===k)||{};
  const v=(f.type==="auto"&&f.fn)?f.fn(o):o[k];
  switch(f.type){
    case "image":
    case "file":   return v&&v.data?assetView(v,"small"):"—";
    case "refmulti":{
      if(!v||!v.length) return '<span class="tbd">未找到</span>';
      return '<div class="cmp-list">'+v.map(id=>'<span class="chip ghost" data-goproduct="'+esc(id)+'">'+esc(id)+"</span>").join("")+"</div>";
    }
    case "select": return v?badge(v):"—";
    default:       return v?esc(v):"—";
  }
}

/* ---------- 列表页 ---------- */
function renderList(coll){
  const s=sch(coll);
  let list=rd(coll,[]);

  /* 跨模块联动：被上游带入的过滤条件 */
  if(coll==="product" && state.supplierFilter) list=list.filter(o=>o.supplierId===state.supplierFilter);
  if(coll==="product" && state.focusId)        list=list.filter(o=>o.productId===state.focusId);
  if(coll==="lead"    && state.stageFilter)    list=list.filter(o=>(o.stage||o.aiStatus||"")===state.stageFilter);

  const q=state.search.trim().toLowerCase();
  if(q) list=list.filter(o=>s.search.map(k=>(o[k]||"")).join(" ").toLowerCase().includes(q));
  (s.filters||[]).forEach(f=>{ if(state[f.k]) list=list.filter(o=>o[f.k]===state[f.k]); });

  const c=$("#content"); c.innerHTML="";

  /* 工具栏 */
  const tb=el("div","toolbar");
  let tbHtml="";
  (s.filters||[]).forEach(f=>{
    /* 选项来源优先级：动态函数 > 预定义常量 > 按现有数据去重 */
    let opts;
    if(f.optsFn) opts=f.optsFn().map(o=>o.v);
    else if(f.opts&&f.opts.length) opts=f.opts;
    else opts=[...new Set(rd(coll,[]).map(o=>o[f.k]).filter(Boolean))];
    tbHtml+='<select data-filter="'+f.k+'"><option value="">'+esc(f.t)+"：全部</option>"+
      opts.map(o=>'<option value="'+esc(o)+'"'+(state[f.k]===o?" selected":"")+">"+esc(o)+"</option>").join("")+
      "</select>";
  });
  if(s.filters&&s.filters.length) tbHtml+=" ";
  tb.innerHTML=tbHtml+'<span class="cnt">共 '+list.length+" 条 · "+esc(s.desc||"")+"</span>";
  if(state.supplierFilter&&coll==="product"){
    const f=getFactory(state.supplierFilter);
    tb.insertAdjacentHTML("afterbegin",
      '<span class="chip">来自工厂：'+esc(state.supplierFilter)+" "+esc(f?f.name:"")+
      '<button data-act="clrFilter">✕</button></span>');
  }
  c.appendChild(tb);

  if(!list.length){
    c.appendChild(el("div","empty",'<div class="big">'+esc(s.ico||"📋")+"</div><div>"+esc(s.emptyTip||"暂无数据")+
      "</div><div class=\"muted\" style=\"margin-top:8px;font-size:12.5px\">点击右上角「＋ 新增」开始录入</div>"));
    return;
  }

  /* 表格 */
  const wrap=el("div","tablewrap");
  let head="<th>"+esc(s.keyLabel)+"</th>";
  s.cols.forEach(k=>{ const f=s.fields.find(x=>x.k===k); head+="<th>"+esc(f?f.t:k)+"</th>"; });
  head+='<th style="width:170px">操作</th>';

  const rows=list.map(o=>{
    let tds='<td><span class="id-link">'+esc(o[s.key])+"</span></td>";
    s.cols.forEach(k=>{
      const f=s.fields.find(x=>x.k===k)||{};
      const cls=(f.type==="refmulti"||f.type==="image"||f.type==="file")?"":'class="row-title"';
      tds+="<td "+cls+">"+cellValue(coll,o,k)+"</td>";
    });
    tds+='<td><div class="row-actions">'+
      '<button class="btn btn-ghost btn-sm" data-open="'+coll+":"+esc(o[s.key])+'">详情</button>'+
      '<button class="btn btn-ghost btn-sm" data-edit="'+coll+":"+esc(o[s.key])+'">编辑</button>'+
      '<button class="btn btn-danger btn-sm" data-del="'+coll+":"+esc(o[s.key])+'">删除</button>'+
      "</div></td>";
    return '<tr data-open="'+coll+":"+esc(o[s.key])+'">'+tds+"</tr>";
  }).join("");
  wrap.innerHTML="<table><thead><tr>"+head+"</tr></thead><tbody>"+rows+"</tbody></table>";
  c.appendChild(wrap);
}

/* ---------- 表单 ---------- */
function openForm(coll, id){
  const s=sch(coll); const old=id?rd(coll,[]).find(o=>o[s.key]===id):null;
  FORMCOLL=coll; FORMID=id||null;
  FORM = old?JSON.parse(JSON.stringify(old)):{};
  if(!old){
    FORM[s.key]=s.idgen?s.idgen():"";
    (s.defaults||[]).forEach(([k,v])=>{ FORM[k]=v; });
    if(state.supplierFilter && coll==="product" && FORM.supplierId===undefined) FORM.supplierId=state.supplierFilter;
  }
  buildForm();
}
function buildForm(){
  const s=sch(FORMCOLL);
  let body="";
  s.fields.forEach(f=>{
    if(f.ro||f.type==="auto"||f.type==="id"||f.hide) return;   // 只读/派生字段不进表单
    const full=(f.type==="textarea"||f.type==="image"||f.type==="file"||
                f.type==="refmulti"||f.type==="imagemulti")?" full":"";
    let inner="";
    switch(f.type){
      case "select":
        inner='<select data-k="'+f.k+'"><option value="">—</option>'+
          (f.opts||[]).map(o=>'<option value="'+esc(o)+'"'+(FORM[f.k]===o?" selected":"")+">"+esc(o)+"</option>").join("")+"</select>";
        break;
      case "selectdyn":{
        const opts=f.optsFn();
        inner='<select data-k="'+f.k+'"><option value="">'+(opts.length?"—":"（暂无可选数据）")+"</option>"+
          opts.map(o=>'<option value="'+esc(o.v)+'"'+(FORM[f.k]===o.v?" selected":"")+">"+esc(o.t)+"</option>").join("")+"</select>";
        break;
      }
      case "textarea":
        inner='<textarea data-k="'+f.k+'" rows="3" placeholder="'+esc(f.ph||"")+'">'+esc(FORM[f.k]||"")+"</textarea>";
        break;
      case "image": case "file":{
        const a=FORM[f.k];
        inner='<div class="filebox" data-file="'+f.k+'">点击上传'+esc(f.t)+
          '<div class="pv" data-pv="'+f.k+'">'+(a&&a.data?assetView(a):"")+"</div></div>";
        if(a&&a.data) inner+='<div class="hint" style="margin-top:4px"><span class="muted" data-clearfile="'+f.k+'" style="cursor:pointer;color:var(--bad)">移除已上传文件</span></div>';
        break;
      }
      case "refmulti":{
        const arr=FORM[f.k]||[];
        inner='<select data-k="'+f.k+'" multiple size="4" style="height:auto">'+
          (f.optsFn?f.optsFn():[]).map(o=>'<option value="'+esc(o.v)+'"'+(arr.includes(o.v)?" selected":"")+">"+esc(o.t)+"</option>").join("")+
          "</select><div class=\"hint\">按住 Ctrl / Cmd 可多选；只能从已录入的产品池中选择</div>";
        break;
      }
      default:
        inner='<input data-k="'+f.k+'" type="'+(f.type==="number"?"number":f.type==="date"?"date":"text")+
          '" value="'+esc(FORM[f.k]||"")+'" placeholder="'+esc(f.ph||"")+'">';
    }
    body+='<div class="field'+full+'"><label>'+esc(f.t)+(f.req?' <span class="req">*</span>':'')+"</label>"+inner+
      (f.hint?'<div class="hint">'+esc(f.hint)+"</div>":"")+"</div>";
  });

  openModal(
    '<div class="modal-head"><div><h3>'+(FORMID?"编辑":"新增")+esc(s.name)+'</h3>'+
      '<div class="sub">'+esc(s.keyLabel)+"："+esc(FORM[s.key]||"（自动生成）")+"</div></div>"+
      '<span class="x" data-act="close">×</span></div>'+
    '<div class="modal-body"><div class="grid2">'+body+"</div></div>"+
    '<div class="modal-foot"><button class="btn btn-ghost" data-act="close">取消</button>'+
    '<button class="btn btn-primary" data-act="save">'+(FORMID?"保存修改":"创建")+"</button></div>",
    s.modalCls||"wide");

  /* 事件绑定 */
  $("#modal").querySelectorAll("[data-k]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      if(inp.multiple) FORM[inp.dataset.k]=[...inp.selectedOptions].map(o=>o.value);
      else FORM[inp.dataset.k]=inp.value;
      saveForm(false);
    });
  });
  $("#modal").querySelectorAll("[data-file]").forEach(box=>{
    box.onclick=()=>{
      const k=box.dataset.file; const i=document.createElement("input");
      i.type="file"; i.accept=(sch(FORMCOLL).fields.find(f=>f.k===k).type==="file")?
        "image/*,.pdf":"image/*";
      i.onchange=e=>{ const file=e.target.files[0]; if(!file) return;
        readAsset(file,a=>{ if(!a){toast("文件读取失败");return;} FORM[k]=a; buildForm(); }); };
      i.click();
    };
  });
  $("#modal").querySelectorAll("[data-clearfile]").forEach(a=>{
    a.onclick=()=>{ FORM[a.dataset.clearfile]=null; buildForm(); };
  });
}
function saveForm(close){
  const s=sch(FORMCOLL);
  const miss=(s.fields.find(f=>f.req && !FORM[f.k]));
  if(miss && close){ toast("请填写必填项："+miss.t); return; }
  if(s.beforeSave) s.beforeSave(FORM);   // 派生字段落库（如从产品池自动读取名称/图片）
  const arr=rd(FORMCOLL,[]);
  const i=arr.findIndex(o=>o[s.key]===FORM[s.key]);
  if(i>=0) arr[i]=FORM; else arr.push(FORM);
  wr(FORMCOLL, arr);
  if(close){ closeModal(); toast(FORMID?"已保存修改":"已创建"); if(AFTER){ const f=AFTER; AFTER=null; f(); } render(); }
}

/* ---------- 详情 ---------- */
function openDetail(coll, id){
  const s=sch(coll); const o=rd(coll,[]).find(x=>x[s.key]===id);
  if(!o){ toast("未找到该记录"); return; }

  let body="";
  /* 图片区 */
  if(s.heroKey){ const a=o[s.heroKey];
    body+='<div class="hero">'+(a&&a.data?assetView(a):'<div class="noimg">未上传图片</div>')+
      '<div style="flex:1"><div style="font-size:18px;font-weight:700">'+esc(rowTitle(coll,o))+"</div>"+
      '<div class="muted" style="margin-top:4px;font-size:12.5px">'+esc(s.keyLabel)+"："+
      '<span class="id-link">'+esc(o[s.key])+"</span></div>"+
      (s.heroExtra?s.heroExtra(o):"")+"</div></div>";
  }
  /* 分组字段 */
  const skip=f=>f.hide||f.type==="id";      // 详情里：主键已在标题栏，其余（含派生字段）全部展示
  const groups=[];
  s.fields.forEach(f=>{ if(skip(f)) return; const g=f.g||"基础信息"; if(!groups.includes(g)) groups.push(g); });
  groups.forEach(g=>{
    body+='<div class="sec-title">'+esc(g)+"</div>";
    let cellHtml="";
    s.fields.forEach(f=>{
      if(skip(f)||(f.g||"基础信息")!==g) return;
      const v=(f.type==="auto"&&f.fn)?f.fn(o):o[f.k];
      let html;
      if(f.type==="refmulti") html=(v&&v.length)?'<div class="cmp-list">'+v.map(id=>'<span class="chip ghost" data-goproduct="'+esc(id)+'">'+esc(id)+"</span>").join("")+"</div>":'<span class="tbd">未找到</span>';
      else if(f.type==="image"||f.type==="file"||(v&&v.data)) html=(v&&v.data)?assetView(v):'<span class="tbd">未上传</span>';
      else if(f.type==="select") html=v?badge(v):'<span class="tbd">未找到</span>';
      else html=(typeof v==="object")?"":((s.tbd&&!v)?'<span class="tbd">TBD / 待确认</span>':esc(v));
      cellHtml+='<div class="kv"><div class="k">'+esc(f.t)+'</div><div class="v">'+html+"</div></div>";
    });
    body+='<div class="kvgrid">'+cellHtml+"</div>";
  });
  /* 关联区块 */
  (s.related||[]).forEach(r=>{ const h=r.fn(o); if(h) body+=h; });

  openModal(
    '<div class="modal-head"><div><h3>'+esc(rowTitle(coll,o))+"</h3>"+
      '<div class="sub">'+esc(s.name)+" · "+esc(s.keyLabel)+"："+esc(o[s.key])+"</div></div>"+
      '<span class="x" data-act="close">×</span></div>'+
    '<div class="modal-body">'+body+"</div>"+
    '<div class="modal-foot">'+(s.detailActions?s.detailActions(o):"")+
      '<button class="btn btn-ghost" data-act="editthis">编辑</button>'+
      '<button class="btn btn-danger" data-act="delthis">删除</button>'+
      '<button class="btn btn-primary" data-act="close">关闭</button></div>',
    "xwide");

  /* 记录当前详情的实体身份，供业务动作按钮使用 */
  const m=$("#modal");
  m.dataset.eid=id; m.dataset.ecoll=coll;
  m.dataset.cid=(coll==="lead"||coll==="crm")?id:((coll==="task"&&o.companyId)?o.companyId:
                (coll==="contact"&&o.companyId)?o.companyId:"");
  m.dataset.pid=(coll==="product"||coll==="featured"||coll==="kb")?id:"";

  m.querySelector('[data-act="editthis"]').onclick=()=>openForm(coll,id);
  m.querySelector('[data-act="delthis"]').onclick=()=>removeRow(coll,id,true);
}

function removeRow(coll,id,inDetail){
  const s=sch(coll); const o=rd(coll,[]).find(x=>x[s.key]===id); if(!o) return;
  confirmBox("确定删除 <b>"+esc(rowTitle(coll,o))+"</b>（"+esc(id)+"）？<br>此操作不可撤销。",()=>{
    wr(coll, rd(coll,[]).filter(x=>x[s.key]!==id));
    if(inDetail) closeModal();
    toast("已删除"); render();
  });
}

/* ---------- 全局事件委托（一次绑定，覆盖所有表格/导航交互） ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const close=t.closest("[data-act='close']");
  if(close){ closeModal(); return; }
  const save=t.closest("[data-act='save']");
  if(save){ saveForm(true); return; }
  const clrF=t.closest("[data-act='clrFilter']");
  if(clrF){ state.supplierFilter=null; render(); return; }
  /* 顺序：行内操作按钮优先，最后才是「点整行看详情」 */
  const ed=t.closest("[data-edit]");
  if(ed){ const [c,i]=ed.dataset.edit.split(":"); openForm(c,i); return; }
  const del=t.closest("[data-del]");
  if(del){ const [c,i]=del.dataset.del.split(":"); removeRow(c,i,false); return; }
  const gp=t.closest("[data-goproduct]");
  if(gp){ openDetail("product",gp.dataset.goproduct); return; }
  const gs=t.closest("[data-gofactory]");
  if(gs){ openDetail("factory",gs.dataset.gofactory); return; }
  const gc=t.closest("[data-gocompany]");
  if(gc){ openCRM(gc.dataset.gocompany); return; }
  const open=t.closest("[data-open],[data-rowopen]");
  if(open){ const [c,i]=(open.dataset.open||open.dataset.rowopen).split(":"); openDetail(c,i); return; }
  const nav=t.closest("#nav a");
  if(nav){ go(nav.dataset.view); return; }
});
document.addEventListener("change",e=>{
  const f=e.target.closest("[data-filter]");
  if(f){ state[f.dataset.filter]=f.value; render(); }
});

</script>
<script>
/* ============================================================
   字段定义（Schema）——唯一真相源
   所有模块的列表 / 表单 / 详情 / 校验都由这里驱动
   ============================================================ */
const ENUMS = {
  ABC   :["A","B","C"],
  HML   :["高","中","低"],
  SMW   :["强","中","弱"],
  DOC   :["完整","部分","缺失"],
  YESNO :["是","否"],
  SUPPORT:["完整","部分","无"],
  YESNOWAIT:["是","否","待确认"],
  CO_TYPE:["品牌商","批发商","进口商","分销商","零售商","制造商/工厂","工程采购商","电商平台卖家","其他"],
  SRC   :["LinkedIn","Google 搜索","展会名单","历史邮件","官网/独立站","客户介绍","名录/黄页","其他"],
  CONTACT_SRC:["官网","LinkedIn","展会","邮件回复","Google","其他"],
  METHOD:["Email","LinkedIn","WhatsApp","电话"],
  TSTATUS:["待处理","已完成","暂停"],
  AISTATUS:["未背调","AI 已背调","人工确认"],
  QUOTE :["未报价","报价中","已报价","已确认价格"],
  SAMPLE:["未寄样","寄样中","已寄样","样品通过","样品未通过"],
  STAGE :["待开发","首次联系","已回复","需求确认","已报价","样品","谈判","成交","暂停"]
};
const SCHEMA = {};

/* ---------- 公用选项 ---------- */
function factoryOpts(){
  return rd("factory",[]).map(f=>({v:f.supplierId,t:f.supplierId+" · "+f.name}));
}
function productOpts(){
  return rd("product",[]).map(p=>({v:p.productId,t:p.productId+" · "+(p.name||"")}));
}
function kbOpts(){                       // AI 只能从这里推荐产品
  return rd("kb",[]).map(k=>{
    const p=getProduct(k.productId);
    return {v:k.productId,t:k.productId+" · "+(p?p.name:(k.name||""))};
  });
}
function companyOpts(){
  return rd("lead",[]).map(c=>({v:c.companyId,t:c.companyId+" · "+(c.name||"")}));
}
function getFactory(id){ return rd("factory",[]).find(f=>f.supplierId===id); }
function getProduct(id){ return rd("product",[]).find(p=>p.productId===id); }
function getKB(id){      return rd("kb",[]).find(k=>k.productId===id); }
function getCompany(id){ return rd("lead",[]).find(c=>c.companyId===id); }
function getCRM(id){     return rd("crm",[]).find(c=>c.companyId===id); }
function getFtd(id){     return rd("featured",[]).find(f=>f.productId===id); }
function contactsOf(id){ return rd("contact",[]).filter(c=>c.companyId===id); }
function productsOf(sid){return rd("product",[]).filter(p=>p.supplierId===sid); }
function tasksOf(id){    return rd("task",[]).filter(t=>t.companyId===id); }
function emailsOf(id){   return rd("email",[]).filter(e=>e.companyId===id); }
function actsOf(id){     return rd("act",[]).filter(a=>a.companyId===id); }

/* ============================================================
   一 / 二 · 工厂管理 Supplier Database（11 字段）
   ============================================================ */
SCHEMA.factory={
  view:"factory", name:"工厂", ico:"🏭", key:"supplierId", keyLabel:"Supplier ID",
  desc:"一个工厂可关联多个产品",
  emptyTip:"暂无工厂，先建立供应链资源",
  idgen:()=>genId("S","factory","supplierId",3),
  search:["supplierId","name","contact","phone","category","market","products","advantage"],
  filters:[{k:"cooperation",t:"配合度",opts:ENUMS.ABC}],
  cols:["name","contact","phone","category","market","cooperation","support","lastContact"],
  fields:[
    {k:"supplierId",t:"Supplier ID",type:"id",ro:true,g:"工厂档案"},
    {k:"name",      t:"工厂名称",  type:"text",req:true,g:"工厂档案"},
    {k:"contact",   t:"联系人",    type:"text",g:"工厂档案"},
    {k:"phone",     t:"联系方式",  type:"text",g:"工厂档案"},
    {k:"category",  t:"产品大类",  type:"text",g:"工厂档案"},
    {k:"products",  t:"可生产产品",type:"textarea",g:"工厂档案"},

}

/* ---------- 常用统计口径 ---------- */
function hasDM(c){ return contactsOf(c.companyId).some(x=>x.isDecisionMaker==="是"); }
function hasSent(c){ return emailsOf(c.companyId).some(e=>e.status==="已发送"); }
function hasReplied(c){
  return actsOf(c.companyId).some(a=>a.type==="客户回复") || tasksOf(c.companyId).some(t=>t.replied==="是");
}
function stageOf(c){ const m=getCRM(c.companyId); return m?(m.stage||"待开发"):"待开发"; }
function stageIdx(st){ return ENUMS.STAGE.indexOf(st); }
function primaryContact(cid){
  const cs=contactsOf(cid);
  return cs.find(x=>x.isDecisionMaker==="是")||cs[0]||null;
}

/* 客户在漏斗中到达的最远节点（0…10） */

function funnelReach(c){
  let i=0;
  if(c.aiStatus && c.aiStatus!=="未背调") i=Math.max(i,1);
  if((c.recProductIds||[]).length)        i=Math.max(i,2);
  if(hasDM(c))                            i=Math.max(i,3);
  if(hasSent(c))                          i=Math.max(i,4);
  if(hasReplied(c))                       i=Math.max(i,5);
  const si=stageIdx(stageOf(c));
  if(si>=stageIdx("需求确认")) i=Math.max(i,6);
  if(si>=stageIdx("已报价"))   i=Math.max(i,7);
  if(si>=stageIdx("样品"))     i=Math.max(i,8);
  if(si>=stageIdx("谈判"))     i=Math.max(i,9);
  if(si>=stageIdx("成交"))     i=Math.max(i,10);
  return i;
}

/* ============================================================
   AI · 主推建议（基于已录入数据计算，不编造任何参数）
   ============================================================ */
function aiFeaturedAdvice(o){
  const m=(arr,v)=>{ const i=arr.indexOf(v); return i<0?0:arr.length-i; };
  let score=0;
  score+=({ "高":3,"中":2,"低":0 })[o.demandLevel]||0;
  score+=({ "强":3,"中":2,"弱":0 })[o.priceComp]  ||0;
  score+=({ "强":2,"中":1,"弱":0 })[o.supplyAdv]  ||0;
  score+=({ "完整":2,"部分":1,"缺失":0 })[o.docLevel]||0;
  let text;
  if(score>=7) text="建议列入主推：市场需求、价格竞争力与供应链优势表现均衡，值得优先投入客户开发。";
  else if(score>=4) text="建议保持观察：具备一定基础，但仍有短板（资料完整度或价格竞争力），建议先补齐资料再判断是否主推。";
  else text="建议暂缓：现有录入数据不足以支撑优先开发，请补充知识库资料并确认价格/交期后再评估。";
  return {score,text,advice:score>=7?"是":(score>=4?"观察":"否")};
}

/* ============================================================
   AI · 背调 + 产品匹配
   只做「读取已有数据 → 结构化整理 → 按关键词匹配知识库」，
   公司信息来自 Linda 录入内容，知识库来自 SYSTEM 内数据。
   ============================================================ */
function tokens(s){
  return (s||"").toLowerCase().split(/[^a-z0-9\u4e00-\u9fa5]+/).filter(w=>w.length>=2||/[a-z]/i.test(w));
}
/* 关键词重叠（双向包含，兼容单复数/词根差异），只用于判断「是否真的存在重合」 */
function overlapHits(kbTokens, clientTokens){
  const hit=[];
  kbTokens.forEach(k=>{
    if(k.length<2) return;
    if(clientTokens.some(c=>c.length>=2 && (c.includes(k)||k.includes(c)))) hit.push(k);
  });
  return [...new Set(hit)];
}
function aiResearch(companyId){
  const leads=rd("lead",[]); const c=leads.find(x=>x.companyId===companyId); if(!c) return;
  const kbs=rd("kb",[]);
  /* 客户侧文本：只取已录入内容 */
  const clientText=[c.name,c.mainProducts,c.intro,c.mainBusiness,c.currentProducts,c.market,c.mayBuy].join(" ");
  const ct=tokens(clientText);

  const scored=kbs.map(k=>{
    const p=getProduct(k.productId)||{};
    const seed=[k.keywords,k.scenario,k.targetCustomerType,k.category,k.sellingPoint,k.painPoints,
                p.name,p.category,p.material,p.surface].join(" ");
    const hits=overlapHits(tokens(seed),ct);
    let score=hits.length;
    const client=[...ct].join(" ");
    if(k.targetMarket && tokens(k.targetMarket).some(w=>client.includes(w))) score+=1;
    if(p.market && tokens(p.market).some(w=>client.includes(w))) score+=1;
    return {k,p,score,hits};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);

  if(!kbs.length || !scored.length){
    c.recProductIds=[];
    c.recReason="未找到匹配产品：产品知识库中暂无与客户业务重合的内容，请先补充知识库或由 Linda 人工判断。";
    c.matchScore="低"; c.grade="C"; c.aiStatus="AI 已背调"; c.aiDate=today();
    c.opportunity=c.opportunity||"暂无足够数据判断合作机会。";
    wr("lead",leads);
    toast("AI 背调完成：未找到匹配产品");
    return;
  }
  c.recProductIds=scored.map(x=>x.k.productId);
  const names=scored.map(x=>(x.p.name||x.k.name||x.k.productId));
  c.recReason="匹配依据（全部来自产品知识库与客户已录入信息，未使用任何推测）：\n"+
    scored.map(x=>"· "+x.k.productId+" · "+esc0(x.p.name||"")+"｜命中关键词："+
      (x.hits.length?x.hits.join("、"):"目标市场一致")).join("\n");
  c.mayBuy=c.mayBuy||names.join("、");
  c.matchPoints=c.matchPoints|| names.join("、")+" 与客户主营产品线存在重合";
  const top=scored[0].score;
  c.matchScore = top>=4?"高":(top>=2?"中":"低");
  c.grade      = top>=4?"A":(top>=2?"B":"C");
  c.aiStatus="AI 已背调"; c.aiDate=today();
  wr("lead",leads);
  toast("AI 背调完成：已匹配 "+scored.length+" 个产品");
}
function esc0(s){ return s||""; }

/* ============================================================
   AI · 开发信生成（读取：背调 + 决策人 + 匹配产品 + 知识库 + 历史沟通）
   规则：简短 / 从客户角度 / 不堆砌公司介绍 / 不用 high quality、best price / 低压力 CTA
   ============================================================ */
function genEmailContent(companyId){
  const c=getCompany(companyId); const ct=primaryContact(companyId);
  const m=getCRM(companyId);
  const ids=(c&&c.recProductIds&&c.recProductIds.length)?c.recProductIds:((m&&m.matchedProducts)||[]);
  const kb=ids.map(getKB).filter(Boolean)[0];
  const p =kb?getProduct(kb.productId):null;
  const prodName=p?p.name:(kb?(kb.name||""):"");
  const history=[...actsOf(companyId)].sort((a,b)=>(b.at||"").localeCompare(a.at||"")).slice(0,1)[0];

  const hi=ct&&ct.name?("Hi "+ct.name.split(" ")[0]+","):"Hi there,";
  const why=c&&(c.mainProducts||c.currentProducts)
    ? "I saw "+c.name+" is focused on "+firstSentence(c.mainProducts||c.currentProducts)+" in "+(c.market||"your market")+"."
    : "I came across "+c.name+" while researching distributors in "+(c.market||"your market")+".";
  const value=kb
    ? [kb.sellingPoint, kb.diffVsCommon, kb.scenario].filter(Boolean).join(" ")
    : "";
  const spec=(p&&(p.material||p.size||p.surface||p.moq))
    ? "Specs on record: "+[p.model,p.material,p.size,p.surface,p.moq?"MOQ "+p.moq:""].filter(Boolean).join(" / ")+"."
    : "Detailed specs are available on request (TBD until confirmed).";
  const angle=history&&history.detail
    ? "Following our last exchange about "+(history.title||"your sourcing plan")+", "
    : "";
  const subject=prodName
    ? (c.name||"Your company")+" × "+prodName+" — spec sheet & samples?"
    : (c.name||"Your company")+" — a quick question on your product line";
  const body=[
    hi,"",
    why,
    value?("That is why I am reaching out: "+value+"."):"",
    spec,
    kb&&kb.painPoints?("Many customers in this range care about: "+kb.painPoints+"."):"",
    angle+"If it makes sense, I can send the spec sheet and 2 units for evaluation — no commitment needed.",
    "",
    "Best regards,",
    "Linda"
  ].filter(Boolean).join("\n");
  return {to:ct?(ct.email||""):"",contact:ct?(ct.name||""):"",subject,
    body:body.replace(/high quality|best price/gi,"competitive and stable supply")};
}
function firstSentence(s){ return String(s||"").split(/[，,;；\n]/)[0].trim(); }

function openEmailModal(companyId){

/* ============================================================
   AI · 跟进内容生成（结合客户业务 / 上次推荐产品 / 新价值点）
   ============================================================ */
function genFollowContent(t){
  const c=getCompany(t.companyId); const ct=primaryContact(t.companyId);
  const ids=(c&&c.recProductIds)||[]; const kb=ids.map(getKB).filter(Boolean)[0];
  const p=kb?getProduct(kb.productId):null;
  const n=(t.followCount||0)+1;
  const angles=[
    "ask how they currently source this range and who they compare us with",
    "share the spec sheet + propose 2 units for internal evaluation",
    "update them on the other items we build for the same category",
    "check whether they have any project or season plan coming up for this line",
    "close the loop politely: put the file on hold until their next purchase cycle"
  ];
  const angle=angles[Math.min(n-1,angles.length-1)];
  const hi=ct&&ct.name?("Hi "+ct.name.split(" ")[0]+","):"Hi there,";
  const bus=c?(c.mainProducts||c.mainBusiness||"your product range"):"your product range";
  const value=kb?[kb.sellingPoint,kb.diffVsCommon,kb.painPoints].filter(Boolean).join(" "):"";
  const prod=p?p.name:(kb?kb.name:"");
  const body=[
    hi,"",
    "Quick follow-up on "+(prod||"our previous exchange")+" for "+bus+".",
    value?("One point that may help on your side: "+value+"."):"",
    t.lastContactContent?("Last time we discussed: "+firstSentence(t.lastContactContent)+"."):"",
    "No pressure either way — just tell me the angle that works for you.",
    "",
    "Best regards,",
    "Linda"
  ].filter(Boolean).join("\n");
  return {suggestion:"第 "+n+" 次跟进 · 目标："+esc(angle)+
    "｜客户等级 "+(t.grade||"—")+" · CRM 阶段 "+(t.stage||"—"),
    body:body.replace(/did you see my last email/gi,"a quick follow-up")};
}

function nextGap(grade){ return ({A:3,B:5,C:7})[grade]||7; }

function timelineBlock(o){

  emailsOf(o.companyId).forEach(e=>items.push({at:e.at,ts:e.ts||0,type:"开发信",title:e.subject,
    sub:"发送至 "+(e.to||"—")+" · "+e.status,cls:"blue"}));
  tasksOf(o.companyId).forEach(t=>items.push({at:t.nextDate,ts:t.ts||0,type:"跟进任务",title:t.taskId+" · "+t.method,
    sub:(t.aiContent||t.goal||"").slice(0,160),cls:t.replied==="是"?"green":""}));
  if(!items.length) return '<div class="sec-title">完整时间线</div><div class="muted">暂无记录。开发 → 发信 → 回复 → 报价 → 样品 → 谈判 → 订单 会全部沉淀在这里。</div>';
  items.sort((a,b)=>((b.at||"").localeCompare(a.at||""))||(b.ts-a.ts));

    items.map(i=>'<div class="tli '+(i.cls||"")+'"><div class="h">'+esc(i.title||"")+'</div>'+

      (i.sub?'<div class="b">'+esc(i.sub)+"</div>":"")+"</div>").join("")+"</div>";
}

<script>
/* ============================================================
   启动层：导航渲染 / 搜索 / 业务动作 / 备份 / 初始化
   ============================================================ */

/* ---------- 侧边栏导航 ---------- */
$("#nav").innerHTML=NAV.map(item=>{
  if(item.type==="group") return '<div class="group">'+esc(item.t)+"</div>";
  return '<a data-view="'+item.v+'"><span class="ico">'+item.ico+"</span>"+esc(item.n)+
    (item.tag?'<span class="tag">'+esc(item.tag)+"</span>":"")+"</a>";
}).join("");

/* ---------- 搜索 / 新增 ---------- */
$("#globalSearch").addEventListener("input",e=>{ state.search=e.target.value; render(); });
$("#addBtn").addEventListener("click",()=>{
  if(state.view==="dashboard") return;
  if(state.view==="crm"){ toast("CRM 客户由「客户开发」模块背调后转入"); return; }
  openForm(VIEWKEY[state.view],null);
});

/* ============================================================
   业务动作（详情页面上的 AI / 流转按钮）
   ============================================================ */
document.addEventListener("click",e=>{
  const t=e.target;

  /* 看板统计卡 / 今日待办跳转 */
  const nv=t.closest("[data-nav]");
  if(nv){ go(nv.dataset.nav); return; }

  const cid=$("#modal")&&$("#modal").dataset.cid;   // 当前详情所属 Company ID
  const act=t.closest("[data-act]");
  if(act && ["aiResearch","genEmail","toCRM","goCRM","genEmailCRM","logAct","newTask",
             "adoptAdvice","genFollow","replyYes","doneNext","addContact",
             "markHandled"].includes(act.dataset.act)){
    handleAct(act.dataset.act,act.dataset.id||cid);
    return;
  }
  const ec=t.closest("[data-editcontact]");
  if(ec){ FORMCOLL="contact"; FORMID=ec.dataset.editcontact;
    FORM=rd("contact",[]).find(c=>c.id===FORMID)||{id:FORMID}; buildForm(); return; }
  const dc=t.closest("[data-delcontact]");
  if(dc){ const id=dc.dataset.delcontact;
    wr("contact", rd("contact",[]).filter(c=>c.id!==id));
    toast("联系人已删除"); closeModal(); openDetail("lead",cid); render(); return; }
});

function handleAct(act){
  const M=$("#modal")||{dataset:{}};
  const cid=M.dataset.cid||"", eid=M.dataset.eid||"";
  const isColl=M.dataset.ecoll||"";
  /* 各动作真正需要的 ID：业务流转用 Company ID，任务操作用 Task ID，主推用 Product ID */
  const id=(act==="genFollow"||act==="replyYes"||act==="doneNext"||act==="adoptAdvice")?eid:cid;
  switch(act){
    /* --- 客户开发 --- */
    case "aiResearch":{
      aiResearch(id);
      const c=getCompany(id); if(c) openDetail("lead",id);
      render(); return;
    }
    case "genEmail": openEmailModal(id); return;
    case "genEmailCRM": openEmailModal(id); return;
    case "goCRM": openCRM(id); return;
    case "addContact":{
      FORMCOLL="contact"; FORMID=null;
      FORM={id:uid(),companyId:id,isDecisionMaker:"是",source:"官网"};
      buildForm();
      AFTER=()=>{ openDetail("lead",id); };
      return;
    }
    case "toCRM":{
      const c=getCompany(id); if(!c) return;
      if(getCRM(id)){ toast("该客户已在 CRM 中"); openCRM(id); return; }
      const ct=primaryContact(id);
      const arr=rd("crm",[]);
      arr.push({companyId:id,name:c.name,country:c.country,website:c.website,
        grade:c.grade||"B",owner:"Linda",contactName:ct?ct.name:"",contactTitle:ct?ct.title:"",
        email:ct?ct.email:"",linkedin:ct?ct.linkedin:"",matchedProducts:c.recProductIds||[],
        requirement:c.mayBuy||"",stage:"待开发",lastContactDate:today(),nextFollowDate:"",
        lastCommunication:"",replySummary:"",quoteStatus:"未报价",sampleStatus:"未寄样",
        expectedAmount:"",actualAmount:"",researcher:"Linda",lastEditor:"Linda",ts:Date.now()});
      wr("crm",arr);
      addAct(id,"进入 CRM",c.name+" 完成背调并进入 CRM","等级 "+(c.grade||"—")+" · 推荐产品："+recNames(c));
      closeModal(); toast("已转入 CRM"); openDetail("crm",id); render(); return;
    }
    /* --- CRM --- */
    case "logAct": logActModal(id); return;
    case "newTask": createTask(id); return;
    /* --- 主推产品 --- */
    case "adoptAdvice":{
      const arr=rd("featured",[]); const f=arr.find(x=>x.productId===id); if(!f) return;
      const adv=aiFeaturedAdvice(f);
      f.isFeatured=(adv.score>=7)?"是":"否";
      wr("featured",arr); toast("已按 AI 建议更新：是否主推 = "+f.isFeatured);
      openDetail("featured",id); render(); return;
    }
    /* --- 跟进任务 --- */
    case "genFollow":{
      const arr=rd("task",[]); const t=arr.find(x=>x.taskId===id); if(!t) return;
      const g=genFollowContent(t);
      t.aiSuggestion=g.suggestion; t.aiContent=g.body;
      wr("task",arr); toast("AI 已生成跟进内容");
      openDetail("task",id); render(); return;
    }
    case "replyYes":{
      const arr=rd("task",[]); const t=arr.find(x=>x.taskId===id); if(!t) return;
      t.replied="是"; t.status="已完成";
      wr("task",arr);
      addAct(t.companyId,"客户回复",(t.companyName||t.companyId)+" 已回复",
        "客户已回复，自动跟进已停止，转入 Linda 人工处理队列");
      const ms=rd("crm",[]); const mi=ms.findIndex(m=>m.companyId===t.companyId);
      if(mi>=0 && ["待开发","首次联系"].includes(ms[mi].stage)){ ms[mi].stage="已回复"; wr("crm",ms); }
      closeModal(); toast("已停止自动跟进，转入人工处理");
      render(); go("crm"); return;
    }
    case "doneNext":{
      const arr=rd("task",[]); const i=arr.findIndex(x=>x.taskId===id); if(i<0) return;
      const t=arr[i];
      t.status="已完成";
      if(t.replied==="是"){
        wr("task",arr);
        addAct(t.companyId,"客户回复",(t.companyName||t.companyId)+" 已回复","已停止自动跟进，转 Linda 处理");
        closeModal(); toast("已完成，因客户已回复停止自动跟进"); render(); return;
      }
      const gap=nextGap(t.grade);
      const nt={...t};
      nt.taskId=genId("T","task","taskId",4);
      nt.followCount=(+t.followCount||0)+1;
      nt.status="待处理";
      nt.lastContactDate=today();
      nt.lastContactContent=(t.aiContent||t.goal||"").slice(0,300);
      nt.nextDate=addDays(gap);
      const g=genFollowContent(nt);
      nt.aiSuggestion=g.suggestion; nt.aiContent=g.body;
      nt.ts=Date.now();
      arr[i]=t; arr.push(nt); wr("task",arr);
      addAct(t.companyId,"跟进任务","第 "+nt.followCount+" 次跟进已生成","下次跟进："+nt.nextDate+" · "+nt.method);
      closeModal(); toast("已完成，下一次跟进已生成："+nt.nextDate);
      openDetail("task",nt.taskId); render(); return;
    }
    case "markHandled":{
      const arr=rd("act",[]); const a=arr.find(x=>x.id===id); if(!a) return;
      a.handled=true; wr("act",arr); toast("已标记处理完毕"); render(); return;
    }
  }
}

/* ---------- 记录一次沟通 ---------- */
function logActModal(companyId){
  openModal(
    '<div class="modal-head"><div><h3>记录一次沟通</h3><div class="sub">内容会写入客户时间线并更新最近联系日期</div></div>'+
      '<span class="x" data-act="close">×</span></div>'+
    '<div class="modal-body"><div class="grid2">'+
      '<div class="field"><label>日期</label><input id="acDate" type="date" value="'+today()+'"></div>'+
      '<div class="field"><label>类型</label><select id="acType"><option>邮件往来</option><option>客户回复</option>'+
        '<option>电话沟通</option><option>报价</option><option>样品</option><option>谈判</option><option>订单</option></select></div>'+
      '<div class="field full"><label>标题</label><input id="acTitle" placeholder="如：发送铰链规格书与报价"></div>'+
      '<div class="field full"><label>沟通内容</label><textarea id="acBody" rows="5"></textarea></div>'+
    "</div></div>"+
    '<div class="modal-foot"><button class="btn btn-ghost" data-act="close">取消</button>'+
    '<button class="btn btn-primary" id="acSave">保存到时间线</button></div>', "");
  $("#acSave").onclick=()=>{
    const at=$("#acDate").value||today(), type=$("#acType").value, ti=$("#acTitle").value, bd=$("#acBody").value;
    if(!ti&&!bd){ toast("请填写标题或内容"); return; }
    addAct(companyId,type,ti||type,bd);
    const ms=rd("crm",[]); const i=ms.findIndex(m=>m.companyId===companyId);
    if(i>=0){
      ms[i].lastContactDate=at;
      ms[i].lastCommunication=[ti,bd].filter(Boolean).join("：");
      if(type==="客户回复"){ ms[i].replySummary=ms[i].replySummary||bd; }
      wr("crm",ms);
    }
    closeModal(); toast("已记录到客户时间线"); openDetail("crm",companyId); render();
  };
}

/* ---------- 建立跟进任务 ---------- */
function createTask(companyId){
  const c=getCompany(companyId), m=getCRM(companyId), ct=primaryContact(companyId);
  const arr=rd("task",[]);
  const t={taskId:genId("T","task","taskId",4),companyId,companyName:c?c.name:"",
    contactName:ct?ct.name:"",grade:(m?m.grade:(c?c.grade:""))||"B",stage:(m?m.stage:"")||"待开发",
    lastContactDate:(m?m.lastContactDate:"")||today(),lastContactContent:(m?m.lastCommunication:"")||"",
    replied:"否",followCount:1,nextDate:addDays(3),method:"Email",goal:"",
    aiSuggestion:"",aiContent:"",status:"待处理",ts:Date.now()};
  if(m){
    const ms=rd("crm",[]); const mi=ms.findIndex(x=>x.companyId===companyId);
    if(mi>=0){ ms[mi].nextFollowDate=t.nextDate; wr("crm",ms); }
  }
  const g=genFollowContent(t); t.aiSuggestion=g.suggestion; t.aiContent=g.body;
  arr.push(t); wr("task",arr);
  addAct(companyId,"跟进任务","建立跟进任务 "+t.taskId,"下次跟进："+t.nextDate+" · "+t.method);
  closeModal(); toast("跟进任务已生成"); openDetail("task",t.taskId); render();
}

/* ============================================================
   导入 / 导出（全 10 张表）
   ============================================================ */
function exportData(){
  const d={_export:"TBD Hardware B2B AI Customer Development System",_at:new Date().toISOString()};
  COLS.forEach(c=>{ d[c]=rd(c,c==="settings"?{}:[]); });
  const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="TBD_B2B_备份_"+today()+".json"; a.click();
  toast("全部数据已导出");
}
function importData(file){
  const r=new FileReader();
  r.onload=e=>{ try{
    const d=JSON.parse(e.target.result);
    if(!d||!d.factory||!d.product) throw 0;
    if(!confirm("导入将覆盖当前全部业务数据（工厂 / 产品 / 主推 / 知识库 / 客户 / CRM / 任务 / 时间线），确定继续？")) return;
    COLS.forEach(c=>{ if(d[c]!==undefined) localStorage.setItem(KEY[c],JSON.stringify(d[c])); });
    toast("导入成功，正在同步云端"); pushSnapshot(); go("dashboard");
  }catch(err){ toast("文件格式不正确"); } };
  r.readAsText(file);
}
